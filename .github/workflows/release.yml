name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish packages to GitHub Packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js (GitHub Packages for @darmawanweb)
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@darmawanweb'

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag matches the package versions
        run: |
          node --input-type=module -e '
            import { readdirSync, readFileSync } from "node:fs";
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            const mismatched = readdirSync("packages")
              .map((dir) => JSON.parse(readFileSync(`packages/${dir}/package.json`, "utf8")))
              .filter((pkg) => !pkg.private && pkg.version !== tag)
              .map((pkg) => `${pkg.name}@${pkg.version}`);
            if (mismatched.length > 0) {
              console.error(`Tag v${tag} does not match: ${mismatched.join(", ")}`);
              process.exit(1);
            }
          '

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Package checks
        run: pnpm check:package

      - name: Publish
        run: pnpm -r publish --no-git-checks --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
