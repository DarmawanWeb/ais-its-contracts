name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js (GitHub Packages for @darmawanweb)
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@darmawanweb'

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # First: the nest kit lints, typechecks and tests against the contracts' dist/.
      - name: Build
        run: pnpm build

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Unit tests plus the integration tests of packages/nest (Docker: TimescaleDB/PostGIS,
      # NATS, Valkey, RustFS, Mailpit through testcontainers).
      - name: Test
        run: pnpm test

      - name: Generated artifacts are up to date
        run: pnpm schemas:check

      - name: Package checks (dist smoke test, publint, are-the-types-wrong)
        run: pnpm check:package
