name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js (GitHub Packages for @darmawanweb)
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@darmawanweb'

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # First: the nest kit lints, typechecks and tests against the contracts' dist/.
      - name: Build
        run: pnpm build

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Unit tests plus the integration tests of packages/nest (Docker: TimescaleDB/PostGIS,
      # NATS, Valkey, RustFS, Mailpit through testcontainers).
      - name: Test
        run: pnpm test

      - name: Generated artifacts are up to date
        run: pnpm schemas:check

      # The methodology catalog is owned by the central repository (spec §17):
      # check that the data modules shipped in contracts match its docs/references.
      - name: Checkout the central methodology catalog
        id: catalog
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v7
        with:
          repository: DarmawanWeb/ais-its-platform
          path: .platform
          sparse-checkout: docs/references
          token: ${{ secrets.PLATFORM_READ_TOKEN || github.token }}

      - name: Methodology catalog is in sync
        if: steps.catalog.outcome == 'success'
        run: pnpm references:check --from "$GITHUB_WORKSPACE/.platform/docs/references"

      - name: Package checks (dist smoke test, publint, are-the-types-wrong, API report)
        run: pnpm check:package

      # The README's minimal service, extracted into a pnpm project with the packed tarballs:
      # install commands, typecheck, build, openapi export and its tests (Docker).
      - name: README example works as documented
        run: pnpm --filter @darmawanweb/ais-its-nest run check:readme
